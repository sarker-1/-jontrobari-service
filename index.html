<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JontroBari</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#ffeaf3,#edf4ff);
  text-align:center;
}

/* 🔥 VISIT BUTTON */
.visit-btn{
  position:fixed;
  top:15px;
  right:15px;
  background:linear-gradient(135deg,#ff2f7d,#ff0059);
  color:white;
  padding:10px 18px;
  border-radius:30px;
  text-decoration:none;
  font-weight:600;
  box-shadow:0 0 20px rgba(255,0,100,.5);
  z-index:999;
  animation:glow 2s infinite;
}

@keyframes glow{
  0%{box-shadow:0 0 10px rgba(255,0,100,.3);}
  50%{box-shadow:0 0 25px rgba(255,0,100,.8);}
  100%{box-shadow:0 0 10px rgba(255,0,100,.3);}
}

/* 🔥 LOADER */
.loader{
  position:fixed;
  inset:0;
  background:#ff2f7d;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:600;
  z-index:9999;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.loader.active{
  opacity:1;
  pointer-events:auto;
}

.spinner{
  width:50px;
  height:50px;
  border:5px solid rgba(255,255,255,.3);
  border-top:5px solid #fff;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-bottom:10px;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

/* MAIN */
.logo{
  width:220px;
  margin-top:40px;
}

h2{margin-top:10px;}
p{color:#ff4d7d;margin-bottom:20px;}

/* BUTTON */
.btn{
  display:block;
  width:85%;
  max-width:320px;
  margin:12px auto;
  padding:16px;
  border-radius:18px;
  color:white;
  text-decoration:none;
  font-weight:600;
  box-shadow:0 10px 20px rgba(0,0,0,.2);
  transition:.2s;
  position:relative;
  overflow:hidden;
}

.btn:active{
  transform:scale(.96);
}

/* COLORS */
.whatsapp{background:#25d366;}
.call{background:#ff4d6d;}
.location{background:#4a7d8c;}
.services{background:#6a5acd;}
.reviews{background:#ffb300;}
.pay{background:#ff2d70;}

</style>
</head>

<body>

<!-- 🔥 VISIT -->
<a href="https://jontrobari.lovable.app/"
class="visit-btn"
onclick="visitSite(event)">
🌐 Visit
</a>

<!-- 🔥 LOADER -->
<div class="loader" id="loader">
  <div class="spinner"></div>
  Redirecting...
</div>

<!-- 🔥 MAIN UI -->
<img src="logo.png" class="logo">

<h2>JontroBari</h2>
<p>At Your Service</p>

<a class="btn whatsapp"
href="https://wa.me/8801560026241?text=Hi%20I%20want%20service"
target="_blank">
WhatsApp
</a>

<a class="btn call"
href="tel:+8801560026241">
Call Now
</a>

<a class="btn location"
href="https://maps.app.goo.gl/KcfMYgYNgyGyyiLdA"
target="_blank">
Location
</a>

<a class="btn services">
Services
</a>

<a class="btn reviews"
href="https://search.google.com/local/writereview?placeid=ChIJbV6OIQDbVTcRroLxH0yk84Q"
target="_blank">
Reviews
</a>

<a class="btn pay">
Pay Now
</a>

<script>

/* ===== VISIT BUTTON FUNCTION ===== */
function visitSite(e){

  e.preventDefault();

  const loader=document.getElementById('loader');
  loader.classList.add('active');

  let delay=600;

  if(navigator.connection){
    const speed=navigator.connection.effectiveType;

    if(speed==='2g'||speed==='slow-2g'){
      delay=2000;
    }
    else if(speed==='3g'){
      delay=1200;
    }
  }

  setTimeout(()=>{
    window.location.href="https://jontrobari.lovable.app/";
  },delay);
}

</script>

</body>
</html>
