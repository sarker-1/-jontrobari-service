<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JontroBari</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#ffeaf3,#edf4ff);
  min-height:100vh;
  overflow-x:hidden;
  text-align:center;
}

/* ===== VISIT BUTTON ===== */

.visit-btn{
  position:fixed;
  top:15px;
  right:15px;
  z-index:999;
  background:linear-gradient(135deg,#ff2f7d,#ff0059);
  color:#fff;
  text-decoration:none;
  padding:11px 18px;
  border-radius:50px;
  font-size:14px;
  font-weight:600;
  box-shadow:0 0 20px rgba(255,0,100,.45);
  animation:glow 2s infinite;
  overflow:hidden;
}

@keyframes glow{
  0%{box-shadow:0 0 10px rgba(255,0,100,.3);}
  50%{box-shadow:0 0 28px rgba(255,0,100,.8);}
  100%{box-shadow:0 0 10px rgba(255,0,100,.3);}
}

/* ===== RIPPLE ===== */

.ripple{
  position:absolute;
  border-radius:50%;
  transform:scale(0);
  background:rgba(255,255,255,0.6);
  animation:rippleEffect .6s linear;
}

@keyframes rippleEffect{
  to{
    transform:scale(4);
    opacity:0;
  }
}

/* ===== LOADING OVERLAY ===== */

.loader{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#ff2f7d,#ff0059);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:20px;
  font-weight:600;
  z-index:99999;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.loader.active{
  opacity:1;
  pointer-events:auto;
}

.spinner{
  width:55px;
  height:55px;
  border:5px solid rgba(255,255,255,.3);
  border-top:5px solid #fff;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-bottom:15px;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

</style>
</head>

<body>

<!-- VISIT BUTTON -->
<a class="visit-btn"
href="https://jontrobari.lovable.app/"
onclick="visitSite(event)">
🌐 Visit
</a>

<!-- LOADER -->
<div class="loader" id="loader">
  <div class="spinner"></div>
  Redirecting...
</div>

<script>

/* ===== RIPPLE EFFECT ===== */

document.querySelector('.visit-btn').addEventListener('click', function(e){

  const ripple=document.createElement('span');
  ripple.classList.add('ripple');

  const rect=this.getBoundingClientRect();

  ripple.style.left=(e.clientX - rect.left) + 'px';
  ripple.style.top=(e.clientY - rect.top) + 'px';

  this.appendChild(ripple);

  setTimeout(()=>ripple.remove(),600);

});

/* ===== SMART VISIT FUNCTION ===== */

function visitSite(e){

  e.preventDefault();

  const loader=document.getElementById('loader');
  loader.classList.add('active');

  let delay = 600; // default fast

  // slow internet detect
  if(navigator.connection){
    const speed = navigator.connection.effectiveType;

    if(speed === '2g' || speed === 'slow-2g'){
      delay = 2000;
    }
    else if(speed === '3g'){
      delay = 1200;
    }
  }

  setTimeout(()=>{
    window.location.href="https://jontrobari.lovable.app/";
  },delay);

}

</script>

</body>
</html>
